<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body  id="pageCenter">
<div th:replace="~{fragments :: header-nav}"></div>
<main>
    <div>
        <h3>Search or Filter Rides</h3>
        <form method="GET" th:action="@{/list}">
            Name: <input type="text" name="searchName" th:value="${searchName}">
            Type: <select name="campus">
            <option value=""></option>
            <option th:each="t : ${Campus}"
                    th:value="${t.name()}"
                    th:text="${t}"
                    th:selected="${t == campus}"
            >TYPE HERE</option>
        </select>
            <input type="submit" value="Search/Filter">
            <a th:href="@{/list}">Clear Search/Filter</a>
        </form>
    </div>


    <h2>Ride List</h2>
    <div th:if="${rideDB == null || rideDB.size() == 0}">
        <p>Empty.</p>
    </div>



    <div th:unless="${rideDB == null || rideDB.size() == 0}">
        <section th:each="entry : ${rideDB}" th:with="current=${rideDB[entry.key]}">
            <!--
            <img class="listItemImage" th:if="${current.hasImage()}" width="125" height="125"
                 th:src="${current.image.getDataUri()}" alt="Item Image."/>
            <img class="listItemImage" th:unless="${current.hasImage()}" width="125" height="125"
                 th:src="@{/Images/noimage.png}" alt="No image provided."/>
            <br>-->
            <h3><a th:href="@{'/view/current/'+${current.id}}" th:text="${current.name}">RIDE NAME</a></h3>
            <p>STATUS: <span th:text="${current.status}"></span></p>
        </section>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
