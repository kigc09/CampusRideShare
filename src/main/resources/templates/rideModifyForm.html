<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head}"></head>
<body id="pageCenter">
<div th:replace="~{fragments :: header-nav}"></div>
<main>
    <div class="ride-container">

        <div >
            <h2>Modify the Ride</h2>
            <form method="POST" th:object="${ride}" enctype="multipart/form-data">
                <div >
                    <label>Name: </label>
                    <input
                        type="text"
                        th:field="*{name}" />
                    <span class="validationError"
                          th:if="${#fields.hasErrors('name')}"
                          th:errors="*{name}">NAME ERROR</span><br>

                    <label>Departure Address:</label>
                    <input
                        type="text"
                        th:field="*{departureAddress}"/>
                    <span class="validationError"
                        th:if="${#fields.hasErrors('departureAddress')}"
                        th:errors="*{departureAddress}">DEPARTURE ERROR</span><br>

                    <label>Campus:</label>
                    <input type="text"
                    th:field="*{campus}"/>
                    <span class="validationError"
                          th:if="${#fields.hasErrors('campus')}"
                          th:errors="*{campus}">CAMPUS ERROR</span><br>

                    <label>Time: </label>
                    <input type="datetime-local"
                        th:field="*{deperatureTime}"/>
                    <span class="validationError"
                          th:if="${#fields.hasErrors('departureTime')}"
                          th:errors="*{departureTime}">TIME ERROR</span><br>

                    <label>Seats</label>
                    <input type="text"
                    th:field="*{seatsAvailable}"/>
                    <span class="validationError"
                          th:if="${#fields.hasErrors('seatsAvailable')}"
                          th:errors="*{seatsAvailable}">SEATS AVAILABLE ERROR</span><br>

                    <label>Status</label>
                    <input type="text"
                    th:field="*{status}"/>
                    <span class="validationError"
                          th:if="${#fields.hasErrors('status')}"
                          th:errors="*{status}">STATUS ERROR</span><br>

                    <button type="submit">Save</button>
                </div>
            </form>
        </div>

        <div>
            <div >
                <form method="POST" th:object="${ride}" th:action="@{'/view/current/'+${ride.id}+'/rides'}" enctype="multipart/form-data">


                    <button>Update Inventory</button>

                </form>
            </div>
        </div>
    </div>
</main>
</body>
<body>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
